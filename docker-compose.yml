version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: acadiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acadiq}
      MYSQL_USER: ${MYSQL_USER:-acadiq_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acadiq_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - acadiq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-acadiq_user}:${MYSQL_PASSWORD:-acadiq_pass}@mysql:3306/${MYSQL_DATABASE:-acadiq}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - acadiq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - acadiq-network

networks:
  acadiq-network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
