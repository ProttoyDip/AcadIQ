services:
  mysql:
    image: mysql:8.0
    container_name: acadiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acadiq}
      MYSQL_USER: ${MYSQL_USER:-acadiq_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acadiq_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - acadiq-network

  backend:
    # Only started with `docker compose --profile full up`, so plain `up` never
    # binds :5000 and shadows a locally running `npm run dev` backend.
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-acadiq_user}:${MYSQL_PASSWORD:-acadiq_pass}@mysql:3306/${MYSQL_DATABASE:-acadiq}
      JWT_SECRET: ${JWT_SECRET:-local_only_change_this_32_char_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDERS_JSON: ${AI_PROVIDERS_JSON:-[]}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NARA_ROUTER_API_KEY: ${NARA_ROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_BACKUP_API_KEY: ${GROQ_BACKUP_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1/chat/completions}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-120b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
      MAX_AI_INPUT_CHARS: ${MAX_AI_INPUT_CHARS:-80000}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_ALLOW_REMOTE: "false"
      EMBEDDING_SIMILARITY_FLOOR: ${EMBEDDING_SIMILARITY_FLOOR:-0.55}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AcadIQ Support}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - acadiq-network

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acadiq-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: acadiq-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost:8080/
    volumes:
      - ./database/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - mysql
    networks:
      - acadiq-network

  ai-service:
    profiles: ["full"]
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: acadiq-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      PORT: 8000
    networks:
      - acadiq-network


networks:
  acadiq-network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
